syntax = "proto3";

package org.interconnection.v2.algos;

//===================================//
//  Protos used in HandshakeRequest  //
//===================================//

// [Sphinx doc begin anchor: SSCompareParamsProposal]
message SSCompareParamsProposal {
  // 支持的版本列表
  repeated int32 supported_versions = 1;

  // 支持的比较操作列表
  // 0=大于, 1=小于, 2=等于, 3=大于等于, 4=小于等于
  repeated int32 compare_ops = 2;
}
// [Sphinx doc end anchor: SSCompareParamsProposal]

//===================================//
//  Protos used in HandshakeResponse //
//===================================//

// [Sphinx doc begin anchor: SSCompareParamsResult]
message SSCompareParamsResult {
  // 版本号
  int32 version = 1;

  // 协商后的比较操作
  // 0=大于, 1=小于, 2=等于, 3=大于等于, 4=小于等于
  int32 compare_op = 2;
}
// [Sphinx doc end anchor: SSCompareParamsResult]

//===================================//
//  Protos used in HandshakeRequest  //
//===================================//

// [Sphinx doc begin anchor: SSCompareDataIoProposal]
message SSCompareDataIoProposal {
  repeated int32 supported_versions = 1;

  // 样本数量
  int64 sample_size = 2;

  // 特征数量
  int32 feature_num = 3;

  // 本地比较列 A 索引
  int32 compare_column_idx = 4;

  // 本地比较列 B 索引, -1 表示不启用两列比较
  int32 compare_column_idx_b = 5;
}
// [Sphinx doc end anchor: SSCompareDataIoProposal]

//===================================//
//  Protos used in HandshakeResponse //
//===================================//

// [Sphinx doc begin anchor: SSCompareDataIoResult]
message SSCompareDataIoResult {
  int32 version = 1;

  // 样本数量
  int64 sample_size = 2;

  // 各方拥有的特征数量
  repeated int32 feature_nums = 3;

  // 结果接收方 rank, -1 表示所有方
  int32 result_to_rank = 4;

  // 全局比较列 A 索引
  int32 compare_column_idx = 5;

  // 全局比较列 B 索引, -1 表示不启用两列比较
  int32 compare_column_idx_b = 6;
}
// [Sphinx doc end anchor: SSCompareDataIoResult]
