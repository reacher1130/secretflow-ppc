syntax = "proto3";

package org.interconnection.v2.algos;

//===================================//
//  Protos used in HandshakeRequest  //
//===================================//

// [Sphinx doc begin anchor: SSPearsonParamsProposal]
message SSPearsonParamsProposal {
  // 支持的版本列表
  repeated int32 supported_versions = 1;
}
// [Sphinx doc end anchor: SSPearsonParamsProposal]

//===================================//
//  Protos used in HandshakeResponse //
//===================================//

// [Sphinx doc begin anchor: SSPearsonParamsResult]
message SSPearsonParamsResult {
  // 版本号
  int32 version = 1;
}
// [Sphinx doc end anchor: SSPearsonParamsResult]

//===================================//
//  Protos used in HandshakeRequest  //
//===================================//

// [Sphinx doc begin anchor: SSPearsonDataIoProposal]
message SSPearsonDataIoProposal {
  repeated int32 supported_versions = 1;

  // 样本数量
  int64 sample_size = 2;

  // 特征数量
  int32 feature_num = 3;
}
// [Sphinx doc end anchor: SSPearsonDataIoProposal]

//===================================//
//  Protos used in HandshakeResponse //
//===================================//

// [Sphinx doc begin anchor: SSPearsonDataIoResult]
message SSPearsonDataIoResult {
  int32 version = 1;

  // 样本数量
  int64 sample_size = 2;

  // 各方拥有的特征数量
  repeated int32 feature_nums = 3;

  // 结果接收方 rank, -1 表示所有方
  int32 result_to_rank = 4;
}
// [Sphinx doc end anchor: SSPearsonDataIoResult]
