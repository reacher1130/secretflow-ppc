syntax = "proto3";

package org.interconnection.v2.algos;

//===================================//
//  Protos used in HandshakeRequest  //
//===================================//

// [Sphinx doc begin anchor: SSXGBParamsProposal]
message SSXGBParamsProposal {
  // 支持的版本列表
  repeated int32 supported_versions = 1;
  
  // 是否支持列采样
  bool support_col_sample_by_tree = 2;
}
// [Sphinx doc end anchor: SSXGBParamsProposal]

//===================================//
//  Protos used in HandshakeResponse //
//===================================//

// [Sphinx doc begin anchor: SSXGBParamsResult]
message SSXGBParamsResult {
  // 版本号
  int32 version = 1;
  
  // boosting轮数，即树的个数
  int32 num_boost_round = 2;
  
  // 树的最大深度
  int32 max_depth = 3;
  
  // 学习率，用于更新的步长缩减，以防止过度拟合
  double learning_rate = 4;
  
  // 决策下来的学习目标函数
  repeated int32 objective = 5;
  
  // 决策下来的l2正则项参数，若等于0，则表示不使用l2正则项
  double reg_lambda = 6;
  
  // 样本分桶的 eps 参数
  double sketch_eps = 7;
  
  // 所有实例的初始化预测分数，全局偏差
  double base_score = 8;
  
  // 伪随机生成器的随机种子
  int32 seed = 9;
  
  // 树训练的列采样率
  double col_sample_by_tree = 10;
}
// [Sphinx doc end anchor: SSXGBParamsResult] 

//===================================//
//  Protos used in HandshakeRequest  //
//===================================//

// [Sphinx doc begin anchor: SSXGBDataIoProposal]
message SSXGBDataIoProposal {
  repeated int32 supported_versions = 1;

  // 样本数量
  int64 sample_size = 2;

  // 特征数量
  int32 feature_num = 3;

  // 是否有标签(Y)
  bool has_label = 4;
}
// [Sphinx doc end anchor: SSXGBDataIoProposal]

//===================================//
//  Protos used in HandshakeResponse //
//===================================//

// [Sphinx doc begin anchor: SSXGBDataIoResult]
message SSXGBDataIoResult {
  int32 version = 1;

  // 样本数量
  int64 sample_size = 2;

  // 各方拥有的特征数量
  // 例如两个参与方的情况下，若 rank 0 有3个特征，rank 1 有4个特征，则 feature_nums 等于 [3, 4]
  repeated int32 feature_nums = 3;

  // 哪一方持有标签
  int32 label_rank = 4;
}
// [Sphinx doc end anchor: SSXGBDataIoResult]